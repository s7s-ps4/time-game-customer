<div class="ov" id="al"></div><div class="ov" id="tm"><div><h3>🕒 حدد وقت الحجز</h3><input id="tmi" type="time"><button onclick="okTime()">تأكيد</button><button class="g" onclick="noTime()">إلغاء</button></div></div>
<script>
firebase.initializeApp(FIREBASE_CONFIG);const fs=firebase.firestore(),au=firebase.auth();
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toEn=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g,'').slice(0,11);
let B=null,U=null,C=null,MB=[],u1=null,u2=null,AC=null,AQ=[],MODE='now',PT='',OI=0,DP=null;const AL=new Set();
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1e3));return p2(Math.floor(s/60))+':'+p2(s%60)};
const hms=ms=>{const s=Math.max(0,Math.floor(ms/1e3));return p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)};
const nm=id=>((B.devs.filter(d=>d.id===id)[0])||{n:'جهاز'}).n;
const run=id=>B.runs.filter(x=>x.dev===id)[0];
const left=id=>{const r=run(id);return r?(r.pa?{pa:1,ms:r.rem}:{ms:r.end-Date.now(),end:r.end}):null};
const anyFree=()=>B.devs.some(d=>!d.off&&!run(d.id));
const firstFree=()=>B.devs.filter(d=>!d.off&&!run(d.id))[0];
const soon=()=>B.runs.filter(r=>!r.pa&&B.devs.some(d=>d.id===r.dev&&!d.off)).sort((a,b)=>a.end-b.end)[0];
const jump=id=>{const e=document.getElementById(id)||$('#s-home');e.scrollIntoView({behavior:'smooth',block:'start'})};
function beep(){try{AC=AC||new AudioContext();AC.resume();[0,.25,.5].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.15)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,100,300,100,300])}catch(e){}}
document.addEventListener('click',()=>{try{AC=AC||new AudioContext();AC.resume()}catch(e){}});
function alertBox(t,m){AQ.push(`<div class="ai"><b>🔔 ${t}</b><p>${m}</p></div>`);$('#al').innerHTML=`<div>${AQ.join('')}<button onclick="closeAl()">تمام</button></div>`;$('#al').style.display='flex';beep()}
function closeAl(){AQ=[];$('#al').style.display='none'}

function setMode(m){if(m==='now'){MODE='now';ui2()}else{$('#tmi').value=PT||'';$('#tm').style.display='flex'}}

if(PT){const h=PT.split(':').map(Number),d=new Date();d.setHours(h[0],h[1]);b.textContent='🕒 '+d.toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})}else b.textContent='🕒 تحديد ميعاد'}
function more(){if(!B)return;$('#al').innerHTML='<div><h3>🎮 تفاصيل الأجهزة</h3>'+B.devs.map(d=>{const l=left(d.id);return `<div class="dr"><b>${esc(d.n)}</b><span>${d.off?'🚫 معطل':l?(l.pa?'⏸ متوقف مؤقتًا':'⏳ '+hms(l.ms)):'✅ فاضي'}</span></div>`}).join('')+'<button onclick="closeAl()">تمام</button></div>';$('#al').style.display='flex'}
function install(){if(DP){DP.prompt();DP.userChoice.finally(()=>{DP=null});return}
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);$('#al').innerHTML='<div><div style="font-size:40px">📲</div><h3>تثبيت التطبيق</h3><p>'+(ios?'اضغط زرار المشاركة ⬆️ في أسفل المتصفح، ثم اختار «إضافة إلى الشاشة الرئيسية».':'افتح قايمة المتصفح ⋮ ثم اختار «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».')+'</p><button onclick="closeAl()">تمام</button></div>';$('#al').style.display='flex'}
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!standalone)$('#inst').style.display='block';
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e});addEventListener('appinstalled',()=>{$('#inst').style.display='none'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
function info(b){let l=null,name='';const f=firstFree();if(!f){const a=soon();if(a){l={ms:a.end-Date.now(),end:a.end};name=nm(a.dev)}}else name=f.n;return{l,name,free:!!f}}
function watch(){if(!B||!U)return;const now=Date.now();
MB.filter(b=>b.s==='wait').forEach(b=>{const r=b.at-now;if(r>18e5||r<-36e5)return;const i=info(b),n=i.name?' ('+esc(i.name)+')':'';
if(r<=6e5&&r>0&&!AL.has('t'+b.id)){AL.add('t'+b.id);if(!i.free)AL.add('b'+b.id);alertBox('حجزك بعد 10 دقايق',i.free?'في جهاز فاضي'+n+'، اتحرك للمكان دلوقتي.':'كل الأجهزة مشغولة. تابع الصفحة وهنبلغك.')}
if(i.l&&!i.l.pa&&i.l.ms>0&&i.l.ms<=3e5){const k='f'+b.id+':'+i.l.end;if(!AL.has(k)){AL.add(k);AL.add('b'+b.id);alertBox('باقي 5 دقائق','على انتهاء وقت أقرب جهاز'+n+'. تابع الصفحة: لو الوقت اتزوّد هيظهر هنا، ولو لأ اتحرك للمحل.')}}
if(i.free&&AL.has('b'+b.id)&&!AL.has('z'+b.id)){AL.add('z'+b.id);alertBox('في جهاز فاضي','اتحرك للمكان دلوقتي.')}})}
function row(b){const now=Date.now(),r=b.at-now,D=new Date(b.at),tm=D.toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'});
const day=D.toDateString()===new Date().toDateString()?'':D.toLocaleDateString('ar-EG',{day:'numeric',month:'short'})+' - ';
let p,nt='';if(b.s==='wait'){if(r>-36e5){p=`<span class="pill bl">منتظر 🕒</span>`;if(r<=6e5){const i=info(b);nt=`<div class="nt">${i.free?'✅ في جهاز فاضي، اتحرك للمكان دلوقتي':'⏳ كل الأجهزة مشغولة'+(i.l&&!i.l.pa?'، أقرب جهاز يفضى بعد '+fmt(i.l.ms):'')+'. تابع الصفحة'}</div>`}}else p='<span class="pill gy">انتهى الميعاد</span>'}
else{const m={came:['حضرت ✓','gr'],noshow:['لم تحضر ✕','rd'],cancel:['ملغي','gy']}[b.s]||['','gy'];p=`<span class="pill ${m[1]}">${m[0]}</span>`}
return `<div class="bkr"><div class="who">👤<span>${esc(b.name)}</span></div><div class="mid"><b>أول جهاز فاضي</b><span>🕒 ${day}${tm}</span></div>${p}${nt}</div>`}
function draw(){if(!B)return;const now=Date.now(),D=B.devs;
const sh=(B.shop||'كيرو بلايستيشن').trim(),w=sh.split(/\s+/);$('#t1').textContent=w[0];$('#t2').textContent=w.slice(1).join(' ');$('#ftx').textContent=sh+' .. دائمًا معك';
const O=(B.offers||[]).slice().sort((x,y)=>y.t-x.t);if(O.length){OI%=O.length;$('#ofb').style.display='flex';$('#oft').textContent=O[OI].txt}else $('#ofb').style.display='none';
const tot=D.length,fr=D.filter(d=>!d.off&&!run(d.id)).length,bz=D.filter(d=>!d.off&&run(d.id)).length,a=soon();let cls='',ic='✓',t,s;
if(fr){t='في جهاز فاضي دلوقتي';s='تقدر تحجز وتبدأ العب فورًا'}else if(a){cls=' bz';ic='⏳';t='أقرب جهاز يفضى: '+esc(nm(a.dev));s='بعد '+fmt(a.end-now)}else{cls=' no';ic='⛔';t='مفيش جهاز متاح حاليًا';s='حاول بعد شوية'}
$('#av').className='av'+cls;$('#av').innerHTML=`<div class="avt"><div class="ck">${ic}</div><div><h3>${t}</h3><p>${s}</p></div><span class="live">مباشر</span></div><div class="st3"><div>كل الأجهزة<b>${tot}</b></div><div><span class="d" style="background:#1fd96b"></span>فاضي<b>${fr}</b></div><div><span class="d" style="background:#f5a524"></span>مشغول<b>${bz}</b></div></div>`;
$('#grid').innerHTML=D.map(d=>{const l=left(d.id);let c,t2,i2,tm='';if(d.off){c='off';t2='معطل';i2='⊘'}else if(l&&l.pa){c='ps';t2='متوقف مؤقتًا';i2='❚❚'}else if(l){c='bz';t2='مشغول';i2='⊕';tm=`<div class="tmr">${hms(l.ms)}</div>`}else{c='fr';t2='فاضي';i2='✓'}
return `<div class="tile ${c==='fr'?'hi':''}"><svg class="cn"><use href="#cs"/></svg><b>${esc(d.n)}</b><div class="chip ${c}">${t2} <i>${i2}</i></div>${tm}</div>`}).join('');
const base=((D[0]&&D[0].n)||'PS4 Slim').replace(/\s*#?\d+\s*$/,'').split(' ');const l1=$('#l1');if(l1){l1.textContent=base[0];$('#l2').textContent=base.slice(1).join(' ')}
const L=MB.slice().sort((x,y)=>y.at-x.at).slice(0,5);$('#myl').innerHTML=U?(L.map(row).join('')||'<div class="mu" style="font-size:13px;color:#9aa3d0">مفيش حجوزات لسه</div>'):'<div style="font-size:13px;color:#9aa3d0">سجّل دخولك بحساب Google عشان تشوف حجوزاتك.</div>';
$('#nxt').textContent=U?'خروج':'دخول';watch()}
function ui(){const a=$('#s-bk');
if(!U){a.dataset.u='';a.innerHTML=`<div class="ph"><span>📅 احجز جلستك</span></div><div class="bkc"><div class="lgo"><div class="p4" id="l1">PS4</div><div class="sl" id="l2">Slim</div></div><div class="fl"><p style="margin:0 0 8px;font-size:13px">سجّل دخولك بحساب Google عشان تحجز، بسهولة وأمان.</p><button class="gb" onclick="login()"><b style="color:#4285f4">G</b> الدخول بحساب Google</button></div></div>`;draw();return}
if(C&&C.banned){a.dataset.u='';a.innerHTML='<div class="ph"><span>📅 احجز جلستك</span></div><div style="font-size:14px">الحجز متوقف لحسابك. تواصل مع المحل.</div><div class="act" style="margin-top:8px"><button class="out" onclick="au.signOut()">خروج ↪</button></div>';return}
if(a.dataset.u===U.uid&&$('#bn'))return;a.dataset.u=U.uid;
a.innerHTML=`<div class="ph"><span>📅 احجز جلستك</span></div><div class="bkc"><div class="lgo"><div class="p4" id="l1">PS4</div><div class="sl" id="l2">Slim</div></div><div class="fl"><div class="fi"><span>👤</span><input id="bn" placeholder="اسمك" value="${esc((C&&C.name)||U.displayName||'')}"></div><div class="fi"><span>📞</span><input id="bp" placeholder="رقم الموبايل (11 رقم)" inputmode="numeric" maxlength="11" pattern="[0-9]*" value="${esc(toEn((C&&C.ph)||''))}" oninput="this.value=toEn(this.value)"></div><div class="seg"><button id="m1" class="on" onclick="setMode('now')">⚡ حجز دلوقتي</button><button id="m2" onclick="setMode('time')">🕒 تحديد ميعاد</button></div><div class="act"><button class="snd" onclick="book()">إرسال الحجز ✈</button><button class="out" onclick="au.signOut()">خروج ↪</button></div></div></div>`;ui2();draw()}
function login(){au.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(()=>alert('تعذر تسجيل الدخول'))}
async function book(){const n=$('#bn').value.trim(),ph=toEn($('#bp').value);
if(!n)return alert('اكتب اسمك');if(!/^\d{11}$/.test(ph))return alert('رقم الموبايل لازم يكون 11 رقم بالظبط');
let at=Date.now();if(MODE==='time'){if(!PT)return alert('حدد الميعاد');const h=PT.split(':').map(Number),d=new Date();d.setHours(h[0],h[1],0,0);if(d.getTime()<Date.now()-18e5)d.setDate(d.getDate()+1);at=d.getTime()}
const o={dev:'any',name:n.slice(0,50),ph,at,by:'عميل (الموقع)',s:'wait',uid:U.uid,email:U.email};let ref;
try{ref=await fs.collection('book').add(o);await fs.doc('cust/'+U.uid).update({name:o.name,ph:o.ph})}catch(e){return alert('تعذر إرسال الحجز')}
if(MODE==='now'){const f=firstFree();if(f)alertBox('تم الحجز ✅','أول جهاز فاضي: '+esc(f.n)+'. اتحرك للمكان دلوقتي.');else{AL.add('b'+ref.id);const a=soon();alertBox('تم الحجز ✅',a?'كل الأجهزة مشغولة. أقرب جهاز يفضى: '+esc(nm(a.dev))+' بعد '+fmt(a.end-Date.now())+'. تابع الصفحة وهنبلغك.':'كل الأجهزة مش متاحة حاليًا.')}}
else alertBox('تم الحجز ✅','هنبلغك قبل ميعادك بـ10 دقايق. تابع الصفحة.')}
au.onAuthStateChanged(async u=>{U=u;if(u1)u1();if(u2)u2();u1=u2=null;C=null;MB=[];
if(u){try{const r=fs.doc('cust/'+u.uid),s=await r.get();if(!s.exists)await r.set({name:(u.displayName||'').slice(0,50),email:u.email,ph:'',t:Date.now(),banned:false});
u1=r.onSnapshot(x=>{C=x.data();ui()});u2=fs.collection('book').where('uid','==',u.uid).onSnapshot(q=>{MB=q.docs.map(d=>({id:d.id,...d.data()}));draw()})}catch(e){}}
ui();draw()});
fs.doc('pub/board').onSnapshot(s=>{if(s.exists){B=s.data();draw()}else $('#av').innerHTML='<div class="avt"><div class="ck">⛔</div><div><h3>المحل لسه مش شغال</h3></div></div>'});
setInterval(draw,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw()});
addEventListener('scroll',()=>{const ids=['s-home','s-dev','s-bk','s-my'];let c=0;ids.forEach((id,i)=>{const e=document.getElementById(id);if(e&&e.getBoundingClientRect().top<innerHeight*.45)c=i});for(let k=0;k<5;k++)$('#n'+k).classList.toggle('on',k===c)},{passive:true});
ui();
</script></body></html>
